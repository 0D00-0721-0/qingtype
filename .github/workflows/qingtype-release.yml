name: Publish QingType preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.6.0-preview.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Validate immutable preview tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/checkout@v6
        with:
          repository: iDvel/rime-ice
          ref: da1fbe602e38f26db846fa10120ee64c2b0324c0
          path: build/rime-ice-fixture
      - run: git submodule update --init --depth 1 librime
      - run: ./scripts/build-dev.sh
      - run: ./scripts/test.sh
        env:
          QINGTYPE_RIME_ICE_TEST_PACKAGE: ${{ github.workspace }}/build/rime-ice-fixture
      - name: Package and verify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/package-app.sh
          python3 tests/DistributionTests.py
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          root = Path('build/distribution/清言.app/Contents')
          version = plistlib.loads((root / 'Info.plist').read_bytes())['CFBundleShortVersionString']
          assert os.environ['RELEASE_TAG'].startswith('v' + version + '-preview.')
          assert json.loads((root / 'Resources/BuildInfo.json').read_text())['workingTreeClean']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.os }}
          path: |
            build/distribution/QingType-*.dmg
            build/distribution/QingType-*.dmg.sha256
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git archive --format=tar.gz --prefix=QingType/ HEAD > release-assets/QingType-source.tar.gz
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --title "清言 $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
