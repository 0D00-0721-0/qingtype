name: QingType build and tests
on:
  push:
    branches: [main, qingtype/main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qingtype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Fetch the pinned Rime headers
        run: git submodule update --init --depth 1 librime
      - name: Extract the upstream runtime without installing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/qingtype-runtime"
          gh release download 1.1.2 --repo rime/squirrel --pattern Squirrel-1.1.2.pkg --dir "$RUNNER_TEMP/qingtype-runtime"
          pkgutil --expand-full "$RUNNER_TEMP/qingtype-runtime/Squirrel-1.1.2.pkg" "$RUNNER_TEMP/qingtype-runtime/expanded"
          runtime_app=$(find "$RUNNER_TEMP/qingtype-runtime/expanded" -type d -name Squirrel.app -print -quit)
          test -n "$runtime_app"
          echo "QINGTYPE_RUNTIME_APP=$runtime_app" >> "$GITHUB_ENV"
      - name: Build QingType and settings
        run: ./scripts/build-dev.sh
      - name: Run isolated engine, UI contract and data-safety checks
        run: ./scripts/test.sh
