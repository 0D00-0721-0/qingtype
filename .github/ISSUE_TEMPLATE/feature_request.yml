name: ✨ 功能建议
description: 提出能让清言更好用的新功能或改进
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 QingType。提交前可以先搜索现有 Issues，看看是否已有类似建议。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述当前流程中的不便、限制或使用场景。
      placeholder: 我在使用……时，经常遇到……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎样改进？
      description: 描述你期待的行为或功能，不必限定具体实现方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代方案
      description: 你现在是如何处理这个问题的？没有可留空。
    validations:
      required: false
  - type: dropdown
    id: impact
    attributes:
      label: 影响范围
      options:
        - 我个人会经常使用
        - 可能帮助不少 QingType 用户
        - 影响安装、升级或数据安全
        - 其他 / 不确定
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附上示意图或非敏感材料。请勿上传真实输入内容、个人词库或账号信息。
    validations:
      required: false
